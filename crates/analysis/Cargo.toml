[package]
name = "gyroship-analysis"
description = "Function discovery, control-flow graphs, jump tables and call graph for AArch64 modules"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gyroship-loader = { version = "0.1.0", path = "../loader" }
# Pinned: decode.rs corrects defects of this exact version (DECISIONS D13).
# Without default features the enums are exhaustive, so a new variant breaks the build.
yaxpeax-arm = { version = "=0.5.0", default-features = false, features = ["std", "fmt"] }
yaxpeax-arch = { version = "=0.3.3", default-features = false, features = ["std"] }
