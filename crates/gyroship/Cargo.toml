[package]
name = "gyroship"
description = "Gyroship: native PC port runtime (window, main loop, config, frame capture)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gyroship-gpu = { path = "../gpu" }
gyroship-hle = { path = "../hle" }
gyroship-runtime = { path = "../runtime" }
winit = "0.30"
libloading = "0.8"
mimalloc = { version = "0.1", optional = true }

# The Joy-Con (src/joycon.rs, examples/joycon_trial.rs) speak Bluetooth LE through WinRT;
# Devices_Enumeration is the trial's alone.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Storage_Streams"] }

[features]
# mimalloc as the global allocator (D52): faster than the Windows heap, which each
# draw's many small blocks went through; off with --no-default-features.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
