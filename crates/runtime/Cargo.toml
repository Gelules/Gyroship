[package]
name = "gyroship-runtime"
description = "Guest CPU context, guest memory, dispatch table and exceptions"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gyroship-loader = { version = "0.1.0", path = "../loader" }
gyroship-analysis = { version = "0.1.0", path = "../analysis" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Threading"] }
