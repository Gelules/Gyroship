[package]
name = "gyroship-tools"
description = "Gyroship developer tools: executables, recompilation, shaders, measures"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
gyroship-loader = { version = "0.1.0", path = "../loader" }
gyroship-analysis = { version = "0.1.0", path = "../analysis" }
gyroship-recomp = { version = "0.1.0", path = "../recomp" }
gyroship-gpu = { version = "0.1.0", path = "../gpu" }
gyroship-runtime = { version = "0.1.0", path = "../runtime" }
gyroship-research = { version = "0.1.0", path = "../research" }
gyroship-practice = { version = "0.1.0", path = "../practice" }
memchr = "2"
# The mods' builder (D113): the entries' JSON, read with its keys in their order, as the Python
# scripts it was ported from read it.
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# The Vulkan probe (vk-probe, D110): wgpu-hal's own ash, and naga's SPIR-V writer.
ash = "=0.38.0"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[target."cfg(windows)".dependencies]
windows-capture = "2"
windows = { version = "0.62", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
