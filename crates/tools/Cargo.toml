[package]
name = "gyroship-tools"
description = "Gyroship developer tools"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
gyroship-loader = { version = "0.1.0", path = "../loader" }
gyroship-analysis = { version = "0.1.0", path = "../analysis" }
gyroship-recomp = { version = "0.1.0", path = "../recomp" }

[target."cfg(windows)".dependencies]
windows-capture = "2"
windows = { version = "0.62", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
