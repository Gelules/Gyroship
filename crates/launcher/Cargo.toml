[package]
name = "gyroship-launcher"
description = "Gyroship's launcher: picks a build and its options, starts the game, runs the setup steps"
version = "1.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
# Where new versions are published (GitHub Releases): the launcher checks it at start (D109).
repository = "https://github.com/Gelules/Gyroship"

[build-dependencies]
tauri-build = "=2.7.5"

[dependencies]
# custom-protocol: a release build that serves its embedded page, not a development one.
tauri = { version = "=2.12.6", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SHA-256 of a release's archives, against the one GitHub gives (D112); already in Tauri's tree.
sha2 = "0.10"

# A workspace of its own: Tauri's tree stays out of Gyroship's lock file, builds and proofs.
[workspace]
