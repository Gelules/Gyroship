[workspace]
resolver = "3"
members = ["crates/*"]
# The launcher is a workspace of its own: Tauri's tree stays out of this lock file,
# of these builds and of the proofs.
exclude = ["crates/launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# naga 30.0.1 with front::Typifier::grow made linear (it was quadratic in a
# function's expression count: seconds per large translated shader). The change
# is marked "Gyroship patch" in vendor/naga/src/front/mod.rs.
[patch.crates-io]
naga = { path = "vendor/naga" }

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"
